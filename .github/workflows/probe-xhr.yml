name: Probe Bookmaker XHR/JSON

on:
  workflow_dispatch:

jobs:
  probe-xhr:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies & Browsers
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install "scrapling[fetchers]" patchright playwright lxml
          python -m patchright install chromium --with-deps
          python -m playwright install chromium --with-deps

      - name: Run XHR/JSON probe
        continue-on-error: true
        env:
          BOOKMAKER_PROXY: ${{ secrets.BOOKMAKER_PROXY }}
        run: python -u probe_xhr.py

      - name: Upload XHR captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhr-captures
          path: xhr_captures/
          retention-days: 7
          if-no-files-found: ignore
