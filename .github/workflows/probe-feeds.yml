name: Probe Bookmaker Feeds

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: comma list of sites to probe (blank = all)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and browsers
        run: |
          python -m pip install --upgrade pip
          pip install "scrapling[fetchers]" lxml
          python -m patchright install chromium --with-deps
          python -m playwright install chromium --with-deps

      - name: Run feed probe
        continue-on-error: true
        env:
          PROBE_ONLY: ${{ github.event.inputs.only }}
          BOOKMAKER_PROXY: ${{ secrets.BOOKMAKER_PROXY }}
        run: python probe_feeds.py

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-feeds
          path: out/probe/
          retention-days: 7
          if-no-files-found: ignore
