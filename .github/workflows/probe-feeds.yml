name: Probe Bookmaker Feeds

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: comma list of sites to probe (blank = all)"
        required: false
        default: ""

permissions:
  contents: write   # lets the workflow save results into the repo

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and browsers
        run: |
          python -m pip install --upgrade pip
          pip install "scrapling[fetchers]" lxml
          python -m patchright install chromium --with-deps
          python -m playwright install chromium --with-deps

      - name: Run feed probe
        continue-on-error: true
        env:
          PROBE_ONLY: ${{ github.event.inputs.only }}
          PROBE_OUT: probe-results
          BOOKMAKER_PROXY: ${{ secrets.BOOKMAKER_PROXY }}
        run: python probe_feeds.py

      - name: Save results into the repo (viewable on GitHub)
        if: always()
        continue-on-error: true
        run: |
          if [ -d probe-results ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f probe-results
            if git diff --cached --quiet; then
              echo "No changes to save"
            else
              git commit -m "Save feed probe results"
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "No probe-results folder to save"
          fi

      - name: Upload probe results (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-feeds
          path: probe-results/
          retention-days: 7
          if-no-files-found: ignore
