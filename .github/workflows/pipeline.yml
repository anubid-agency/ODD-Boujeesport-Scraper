name: Odds Aggregation Pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      run_browser:
        description: "Enable headless browser fallback (StealthyFetcher) for SPA/JS bookmakers"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_workers:
        description: "Override concurrent workers (default: auto by browser mode)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: odds-aggregation-pipeline
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OUTPUT_DIR: out
      PER_SOURCE_TIMEOUT_SEC: "50"
      RUN_BROWSER: ${{ inputs.run_browser || 'false' }}
      MAX_WORKERS: ${{ inputs.max_workers }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scrapling[fetchers]"

      - name: Install Chromium and system dependencies for browser mode
        if: env.RUN_BROWSER == 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: Run odds pipeline
        run: |
          mkdir -p "$OUTPUT_DIR"
          python runner.py

      - name: Print health.json summary
        if: always()
        run: |
          cat "$OUTPUT_DIR/health.json" || true

      - name: Upload pipeline output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds-pipeline-output-${{ github.run_id }}
          path: |
            out/matches.jsonl
            out/health.json
          if-no-files-found: warn
          retention-days: 7
