name: Odds Aggregation Pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      run_browser:
        description: "Enable browser fallback for blocked/JS sources (true/false)"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  group: odds-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      RUN_BROWSER: ${{ github.event.inputs.run_browser || 'false' }}
      OUTPUT_DIR: out

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies and Scrapling
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install "scrapling[fetchers]"
          fi
          scrapling install

      - name: Run odds pipeline
        run: |
          mkdir -p "$OUTPUT_DIR"
          python runner.py

      - name: Upload pipeline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds-pipeline-output-${{ github.run_id }}
          path: |
            out/matches.jsonl
            out/health.json
          if-no-files-found: warn
          retention-days: 7
